# Modules that have to be force-loaded on the JetHome JetHub D3-mini (j310).
#
# meson-s7-jethub-j310.dts puts two I2C GPIO expanders on the board:
#   i2c2: exp21 "ti,tca6408"
#   i2c3: exp24 "nxp,pca9535"  - carries the joystick keys (gpio-keys-polled)
# Both are handled by drivers/gpio/gpio-pca953x.c.  The gpio-keys-polled node
# and anything else referencing &exp24 stays deferred forever if that driver is
# never loaded, so it is requested explicitly here - the same reason j200 pins
# its expander driver.  If the kernel config builds it in (=y) modprobe simply
# succeeds and this line is a no-op.
gpio-pca953x

# Deliberately NOT listed:
#   ds2482  - j200 needs it for its 1-Wire master; j310 has no DS2482 and no
#             1-Wire bus in the device tree.
#   rtc-pcf8563, tmp102, at24, ssd1306fb, atmel-ecc, gpio-keys-polled
#           - ordinary I2C/platform clients that bind through their OF
#             modaliases once their parent bus is up; nothing on this board
#             needs them before userspace is running.
