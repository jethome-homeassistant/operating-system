# The vendor U-Boot shifts every partition past the inherent Amlogic areas by
# CONFIG_MBR_ROOTFS_OFFSET_EXTRA (204 MiB, board/amlogic/configs/jethub_j310.h)
# when it regenerates the MBR, and it does regenerate it whenever the on-disk
# table disagrees with the one in _aml_dtb.PARTITION. The first partition
# therefore lands at 132 MiB of inherent areas + 204 MiB = 336 MiB, and the
# window in between is where the two raw recovery slots live.
#
# So reserve that whole span here, or a directly written .img would carry a
# partition table the bootloader immediately overwrites with a different one.
#
# Note this is the *partition* size, not the image size: spl.img itself is
# still built at BOOT_SPL_SIZE by image-spl-spl.cfg, so the RAUC bundle keeps
# carrying 8 MiB rather than 336. Genimage zero-pads the rest.
partition spl {
	size = 336M
	image = "spl.img"
	in-partition-table = "no"
	offset = 0
	holes = {"(440; 512)"}
}
